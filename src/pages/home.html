<!--@header-->
<h1>{{t:title}}</h1>
  <p class="lead">{{t:lead}}</p>
  <p class="checked" id="checked"></p>
<!--@main-->
<figure class="hero">
  <picture>
    <source media="(min-width: 600px)" srcset="{{v:root}}images/valley-wide-1200.webp 1200w, {{v:root}}images/valley-wide-1800.webp 1800w" sizes="min(1120px, 100vw - 32px)" width="1800" height="693">
    <img src="{{v:root}}images/valley-800.webp" width="800" height="500" alt="{{t:heroAlt}}" fetchpriority="high">
  </picture>
  <svg class="ridge-cut" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path class="back" d="M0 88V56L80 44 150 52 230 26 300 46 380 38 450 58 540 32 610 50 690 42 760 60 840 36 920 52 1000 34V88H0Z"/><path class="front" d="M0 100V80L90 66 170 76 260 60 340 74 420 68 500 82 600 64 680 76 760 66 850 80 930 68 1000 76V100Z"/></svg>
</figure>

<main>
  <section class="tools" aria-labelledby="tools-title">
    <h2 id="tools-title" class="sr-only">{{t:toolsTitle}}</h2>
    <div class="field">
      <label for="q">{{t:searchLabel}}</label>
      <div class="search">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="{{t:searchPh}}">
      </div>
    </div>
    <div class="two">
      <div class="field">
        <label for="city">{{t:cityLabel}}</label>
        <select id="city"><option value="">{{t:allCities}}</option></select>
      </div>
      <div class="field">
        <label for="type">{{t:typeLabel}}</label>
        <select id="type">
          <option value="">{{t:allTypes}}</option>
          <option value="pantry">{{t:type_pantry}}</option>
          <option value="mobile">{{t:type_mobile}}</option>
          <option value="meals">{{t:type_meals}}</option>
        </select>
      </div>
    </div>
    <label class="today" for="today">
      <input id="today" type="checkbox" role="switch">
      <span class="today-text"><span>{{t:openToday}}</span> <span id="todayName" class="today-day"></span></span>
      <span class="sw" aria-hidden="true"></span>
    </label>
  </section>

  <div class="status">
    <p id="count" aria-live="polite">{{v:count}}</p>
    <button type="button" id="clear" class="link-btn" hidden>{{t:clear}}</button>
  </div>
  <p id="unclearNote" class="hint" hidden></p>

  <div id="results" tabindex="-1">
{{v:cards}}
</div>

  <noscript><p class="hint">{{t:noscript}}</p></noscript>
</main>
<!--@band-->
<section class="help" id="contact" aria-labelledby="help-title">
  <h2 id="help-title">{{t:contactTitle}}</h2>
  <p>{{t:contactLead}}</p>
  <a class="btn call" href="tel:+17607753663"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span>{{t:contactCall}}</span></a>
  <dl class="help-list">
    <div><dt>{{t:contactAddressLabel}}</dt><dd>{{t:contactAddress}}</dd></div>
    <div><dt>{{t:contactEmailLabel}}</dt><dd><a href="mailto:info@findfoodbank.org">info@findfoodbank.org</a></dd></div>
  </dl>
  <p class="hint">{{t:contactHours}}</p>
  <p><a class="text-link" href="https://findfoodbank.org/map/" rel="noopener">{{t:contactCalendar}}</a></p>
</section>
