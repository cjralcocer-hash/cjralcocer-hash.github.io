<!DOCTYPE html>
<html lang="{{v:lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{p:docTitle}}</title>
<meta name="description" content="{{p:description}}">
<!-- GENERATED by scripts/build.py from src/ and i18n/. Edit those, then run the build; do not edit this file by hand. -->
<link rel="canonical" href="{{v:canonical}}">
<link rel="alternate" hreflang="es" href="{{v:urlEs}}">
<link rel="alternate" hreflang="en" href="{{v:urlEn}}">
<link rel="alternate" hreflang="x-default" href="{{v:urlEs}}">

<!-- Open Graph: how the link looks when shared in WhatsApp, Facebook, texts, etc. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{t:siteName}}">
<meta property="og:title" content="{{p:ogTitle}}">
<meta property="og:description" content="{{p:ogDescription}}">
<meta property="og:url" content="{{v:canonical}}">
<meta property="og:image" content="{{v:site}}/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{p:ogImageAlt}}">
<meta property="og:locale" content="{{v:ogLocale}}">
<meta property="og:locale:alternate" content="{{v:ogLocaleAlt}}">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="{{v:root}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{v:root}}favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{v:root}}apple-touch-icon.png">
<meta name="theme-color" content="#f9f0da" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#091d15" media="(prefers-color-scheme: dark)">
<link rel="preload" href="{{v:root}}fonts/alfa-slab-one-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{v:root}}styles.css">
{{v:jsonld}}
</head>
<body class="page-{{v:pageId}}" data-report="{{v:reportUrl}}">
<a class="skip" href="#{{v:skipTo}}">{{t:skip}}</a>

<nav class="langbar" aria-label="{{t:navLabel}}">
  <div class="langbar-in">
    <span class="lb-cur" lang="{{v:lang}}"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>{{t:langCurrent}}</span>
    <a class="lb-other" href="{{v:otherHref}}" lang="{{v:otherLang}}" hreflang="{{v:otherLang}}">{{t:langOther}} <span aria-hidden="true">→</span></a>
  </div>
</nav>
{{v:nav}}
<div id="notice" class="notice" role="status" hidden></div>

<header class="site">
  <div class="top">
    <div class="logo">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 21.5c.3-4.6 1.4-8.6 3.6-12"/><path d="M13.1 9.5c-2.6-2.4-6-2.6-8.6-.4M13.1 9.5c-.4-3-2.6-5.4-5.6-5.8M13.1 9.5c1.2-2.8 4-4.4 7-3.9M13.1 9.5c2.9.3 5.4 2.2 6.5 4.9"/><path d="M2.5 21.5h19"/></svg></span>
      <span>{{t:siteName}}</span>
    </div>
  </div>
  {{@header}}
</header>

{{@main}}

<svg class="ridge-top" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path class="back" d="M0 88V58L60 46 120 52 200 22 260 36 330 30 420 54 500 44 580 60 660 30 720 40 800 18 870 42 940 36 1000 50V88H0Z"/><path class="front" d="M0 100V80L100 64 180 72 280 56 380 76 470 66 560 82 660 62 760 74 860 60 1000 78V100Z"/></svg>
<div class="band">
{{@band}}

<footer class="site">
  <p>{{t:footer1}}</p>
  <p><span>{{t:footer2}}</span>
    <a href="https://findfoodbank.org/map/" rel="noopener">{{t:footerSource}}</a></p>
  <p>{{t:footer3}}</p>
  <p class="credit">{{h:credit}}</p>
  <p>{{t:footerFlyerLead}} <a href="{{v:home}}flyer/">{{t:footerFlyerLink}}</a></p>
  <p><a href="#top" id="toTop">{{t:toTop}}</a></p>
</footer>
</div>

<script type="application/json" id="i18n">{{v:i18nJson}}</script>
{{v:scripts}}
</body>
</html>
